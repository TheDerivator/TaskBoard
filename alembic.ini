# Used only by developers for `uv run alembic revision --autogenerate -m "..."`.
# The application runs migrations through taskboard/db/migrate.py and needs no ini file.
# The database URL comes from TASKBOARD_DATABASE_URL / TASKBOARD_DATA_DIR (see taskboard/config.py).

[alembic]
script_location = %(here)s/taskboard/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix-only REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
